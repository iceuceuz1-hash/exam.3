<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where in the world?</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;800&display=swap" rel="stylesheet">
  
  <!-- CSS fayllar (css/ papkasi ichida joylashgani uchun) -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header__container">
      <h1 class="header__title">Where in the world?</h1>
      
      <button class="dark-mode-btn" id="darkModeBtn">
        <svg class="dark-mode-btn__icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
        <span>Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="container">
      
      <!-- CONTROLS -->
      <section class="controls">
        <div class="search-box">
          <svg class="search-box__icon" fill="none" stroke="#848484" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search for a country..." 
            autocomplete="off"
          >
        </div>

        <div class="filter-box">
          <select id="regionSelect">
            <option value="All">Filter by Region</option>
            <option value="Africa">Africa</option>
            <option value="Americas">Americas</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
          </select>
        </div>
      </section>

      <!-- DAVLATLAR GRIDI -->
      <section class="countries-grid" id="countriesContainer">
        <!-- Javascript orqali to'ldiriladi -->
      </section>

    </div>
  </main>

  <!-- MODAL OYNA (Kattaroq ko'rinish va batafsil ma'lumotlar uchun) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal__close-btn" id="modalCloseBtn">&times;</button>
      <div class="modal__content" id="modalContent">
        <!-- JS orqali to'ldiriladi -->
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
